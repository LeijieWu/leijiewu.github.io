{% assign presentation_title = post.title | remove_first: "Conference Talk: " %}
<li class="cv-presentation" itemscope itemtype="https://schema.org/PresentationDigitalDocument">
  <p>
    <strong itemprop="name">{{ presentation_title }}</strong>.
    {{ post.type }}, {{ post.location }}, {{ post.date | date: "%B %Y" }}.
    <em>Presented by {{ post.presenter }}.</em>
    {% if post.eventurl %}<a href="{{ post.eventurl }}" target="_blank" rel="noopener">[Event]</a>{% endif %}
    {% if post.paperurl %}<a href="{{ post.paperurl }}" target="_blank" rel="noopener">[Paper]</a>{% endif %}
  </p>
</li>
